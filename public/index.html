<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SER&TEC — Geocodificador</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link rel="stylesheet" href="sertec-brand.css">
</head>
<body class="st-pagina">

  <nav class="st-navbar">
    <div class="st-navbar-logo">
      <img src="LogoST.png" alt="Ser&Tec" onerror="this.style.display='none'">
      <span class="st-navbar-nombre">SER<span class="st-amp">&</span>TEC<span class="st-sas">SAS</span></span>
    </div>
    <div class="st-navbar-herramienta">Geocodificador ArcGIS</div>
  </nav>

  <main class="st-contenedor">
    <section class="st-seccion">
      <p class="st-label-amarillo">Sistemas GIS · Salta & Jujuy</p>
      <h1>Procesamiento de Registros</h1>
    </section>

    <div class="st-grid-2">
      <div class="st-card st-card-accent">
        <h3 class="st-card-titulo">1. Cargar Archivo</h3>
        <div id="uploadArea" class="st-dropzone">
          <p class="st-dropzone-titulo">Arrastrá el archivo REAP o OML aquí</p>
          <p class="st-dropzone-sub">o hacé click para buscar</p>
        </div>
        <input type="file" id="fileInput" accept=".csv, .txt" hidden>
      </div>

      <div class="st-card">
        <h3 class="st-card-titulo">2. Ejecución</h3>
        <div class="st-campo">
          <label class="st-label-campo">Método</label>
          <select id="geoMode" class="st-select">
            <option value="local">Modo Local (Rápido)</option>
            <option value="api">Modo Preciso (API)</option>
          </select>
        </div>
        <button id="processBtn" class="st-btn st-btn-primario st-btn-lg" disabled style="width: 100%; justify-content: center;">
          Procesar Datos
        </button>
      </div>
    </div>

    <section class="st-seccion">
      <div class="st-card">
        <h3 class="st-card-titulo">Resultados</h3>
        <div class="st-tabla-wrapper">
          <table id="previewTable" class="st-tabla">
            <thead>
              <tr>
                <th>Referencia</th>
                <th>Localidad</th>
                <th>Dirección</th>
                <th class="st-col-amarillo">Latitud</th>
                <th class="st-col-amarillo">Longitud</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const tbody = document.querySelector('#previewTable tbody');
    let rawData = [];

    // Manejo de archivos
    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = (e) => leerArchivo(e.target.files[0]);
    
    uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.classList.add('activo'); };
    uploadArea.ondragleave = () => uploadArea.classList.remove('activo');
    uploadArea.ondrop = (e) => {
      e.preventDefault();
      uploadArea.classList.remove('activo');
      leerArchivo(e.dataTransfer.files[0]);
    };

    function leerArchivo(file) {
      if (!file) return;
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawData = results.data;
          renderTabla(rawData.slice(0, 10)); // Vista previa
          processBtn.disabled = false;
          processBtn.innerText = `Procesar ${file.name}`;
        }
      });
    }

    function renderTabla(datos) {
      tbody.innerHTML = datos.map(f => `
        <tr>
          <td>${f.Referencia || f.ID || '-'}</td>
          <td>${f.Localidad || '-'}</td>
          <td>${f.Direccion || f.Calle || '-'}</td>
          <td>-</td>
          <td>-</td>
          <td><span class="st-badge st-badge-gris">Listo</span></td>
        </tr>
      `).join('');
    }

    processBtn.onclick = async () => {
      processBtn.disabled = true;
      processBtn.innerText = "Procesando...";
      
      const modo = document.getElementById('geoMode').value;
      
      if (modo === 'api') {
        try {
          const res = await fetch('/.netlify/functions/geocodificar', {
            method: 'POST',
            body: JSON.stringify(rawData)
          });
          const final = await res.json();
          // Aquí actualizas con los datos reales de la API
          alert("Proceso finalizado vía API");
        } catch (e) {
          alert("Error en la conexión con Netlify Functions");
        }
      } else {
        alert("Proceso Local completado (Simulación)");
      }
      
      processBtn.disabled = false;
      processBtn.innerText = "Procesar Datos";
    };
  </script>
</body>
</html>
